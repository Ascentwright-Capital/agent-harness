# On every change to shared/ on main, open or update a "Sync agent harness" pull request in
# each repository in repos.txt. Needs a GitHub App (HARNESS_APP_ID, HARNESS_APP_KEY) installed
# on those repositories with contents and pull requests write access.
name: Sync agent harness
on:
  push:
    branches: [main]
    paths: [shared/**, repos.txt]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [nusa-auto, website, OpenBot, OpenTag]
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_KEY }}
          owner: Ascentwright-Capital
          repositories: ${{ matrix.repo }}
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          repository: Ascentwright-Capital/${{ matrix.repo }}
          token: ${{ steps.token.outputs.token }}
          path: target
      - run: harness/scripts/sync.sh target
      - uses: peter-evans/create-pull-request@v7
        with:
          path: target
          token: ${{ steps.token.outputs.token }}
          branch: chore/agent-harness-sync
          title: "[Chore] Sync agent harness (AP-97)"
          commit-message: "[Chore] Sync agent harness (AP-97)"
          body: Synced from Ascentwright-Capital/agent-harness@${{ github.sha }}.
          delete-branch: true
